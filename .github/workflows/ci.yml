name: CI

on:
  push:
    branches: [ main, dev, "feature/**" ]
  pull_request:
    branches: [ main ]

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Run unit tests
  # ─────────────────────────────────────────────
  test:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    defaults:
      run:
        working-directory: backend

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: 📦 Install dependencies
        run: pip install -r requirements.txt

      - name: 🧪 Run tests with pytest
        run: |
          python -m pytest tests/ -v --tb=short \
            --junitxml=pytest-report.xml

      - name: 📊 Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-results-${{ matrix.python-version }}
          path: backend/pytest-report.xml

  # ─────────────────────────────────────────────
  # Job 2: Lint & code style check
  # ─────────────────────────────────────────────
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 📦 Install ruff
        run: pip install ruff

      - name: 🔍 Run Ruff linter
        run: ruff check app/ --output-format=github

  # ─────────────────────────────────────────────
  # Job 3: Verify FastAPI app boots correctly
  # ─────────────────────────────────────────────
  boot-check:
    name: Server Boot Check
    runs-on: ubuntu-latest
    needs: test

    defaults:
      run:
        working-directory: backend

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: 📦 Install dependencies
        run: pip install -r requirements.txt uvicorn

      - name: 🚀 Start server and health check
        run: |
          python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          sleep 4
          curl --fail --retry 3 --retry-delay 2 \
            http://localhost:8000/api/v1/health | python -m json.tool

      - name: 📬 Test /infer endpoint (Cache MISS → HIT cycle)
        run: |
          echo "=== Request 1: Should be Cache MISS ==="
          curl --fail -s -X POST http://localhost:8000/api/v1/infer \
            -H "Content-Type: application/json" \
            -H "X-API-Key: sk-nexus-dev-demo-key" \
            -d '{"prompt": "What is the capital of France?", "provider": "mock"}' \
            | python -m json.tool

          echo "=== Request 2: Should be Cache HIT ==="
          curl --fail -s -X POST http://localhost:8000/api/v1/infer \
            -H "Content-Type: application/json" \
            -H "X-API-Key: sk-nexus-dev-demo-key" \
            -d '{"prompt": "What is the capital of France?", "provider": "mock"}' \
            | python -m json.tool

          echo "=== Request 3: Volatile query — Should bypass cache ==="
          curl --fail -s -X POST http://localhost:8000/api/v1/infer \
            -H "Content-Type: application/json" \
            -H "X-API-Key: sk-nexus-dev-demo-key" \
            -d '{"prompt": "What is the weather today in Tokyo?", "provider": "mock"}' \
            | python -m json.tool

      - name: 📊 Verify cache stats
        run: |
          curl --fail -s http://localhost:8000/api/v1/cache/stats \
            -H "X-API-Key: sk-nexus-dev-demo-key" \
            | python -m json.tool
